name: sspg.ch / PROD deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-deploy
  # Ein laufender Deploy wird nicht mitten in der Übertragung abgebrochen.
  cancel-in-progress: false

# Deploy per SSH/rsync. Regeln in .github/deploy/rsync-filter: was dort mit "-" steht, wird weder
# übertragen noch auf dem Server gelöscht; alles andere, was nicht im Repository liegt, löscht der
# Deploy auf dem Server.
#
# Einrichtung (einmalig):
#   1. Schlüsselpaar nur für den Deploy, ohne Passphrase, ausserhalb des Repositorys erzeugen:
#        Git Bash:   ssh-keygen -t ed25519 -N "" -C "github-deploy-sams-secure-password-generator" -f deploy_key
#        PowerShell: ssh-keygen --% -t ed25519 -N "" -C github-deploy-sams-secure-password-generator -f deploy_key
#      deploy_key.pub im cyon-Panel als SSH-Schlüssel hinterlegen.
#   2. Settings → Secrets and variables → Actions (Repository): Variables SSH_HOST, SSH_PORT
#      (leer = 22), SSH_KNOWN_HOSTS (Ausgabe von ssh-keyscan -p <port> <host>); Secret SSH_USER.
#   3. Settings → Environments → "production": Secrets SSH_PRIVATE_KEY (Inhalt von deploy_key, danach
#      lokal löschen) und DEPLOY_PATH (per SSH in den Ordner 0701_Sspg.ch wechseln, pwd).
#   Benutzer und Pfad sind Secrets, weil Variablen im Log stehen - und Logs sind bei einem
#   öffentlichen Repository für alle lesbar.
#   4. Workflow starten: ohne Variable DEPLOY_RSYNC_LIVE läuft nur ein Probelauf (--dry-run) und endet
#      rot. Im Log die Zeilen "*deleting" prüfen (erwartet: Altlasten wie .ftp-deploy-sync-state.json),
#      dann im Environment DEPLOY_RSYNC_LIVE = true setzen und erneut starten.
#   Das alte Secret FTP_USER wird danach nicht mehr gebraucht.
#
# TESTS (2026-11): deployt wird nur nach grünen Tests (tests.yml: gleicher Build wie hier, Seiten und verlinkte
# Dateien über einen lokalen Server). Build und Smoke-Test liegen in .github/deploy/build.sh und smoke.sh.
#
# PERFORMANCE (2026-11): Lighthouse CI (Mobil, 3 Läufe, Median) wie pagespeed.web.dev, Schwellen in lighthouserc.cjs.
# Es gibt keinen TEST-Host: vor dem Deploy wird die gebaute Site im Runner gemessen (Profil local), nach dem Deploy
# die Live-Domain (Profil prod; rot = Lauf rot, kein Rollback). Tabelle in der Zusammenfassung des Laufs, Berichte
# in den Artefakten "lighthouse-local" und "lighthouse" (PROD). Eigene Jobs, damit .lighthouseci/ nie im Checkout
# des Deploys landet.
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  lighthouse-local:
    name: Lighthouse (gebaute Site im Runner)
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20

    # gemessen wird, was deployt würde (minifiziert)
    - name: Build
      run: bash .github/deploy/build.sh

    - name: Lighthouse
      env:
        LH_URL: http://127.0.0.1:8080
        LH_PROFILE: local
      run: |
        python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
        for _ in $(seq 1 20); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.5; done
        npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

    - name: Lighthouse-Zusammenfassung
      if: always()
      run: node scripts/lighthouse-summary.cjs >> "$GITHUB_STEP_SUMMARY"

    - name: Lighthouse-Berichte
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lighthouse-local
        path: .lighthouseci/reports/
        retention-days: 14

  web-deploy:
    name: Deploy
    needs: [tests, lighthouse-local]
    # PROD nur von main - auch wenn der Workflow manuell auf einem anderen Branch gestartet wird.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sspg.ch
    steps:
    - name: PROD-Zugang (SSH) vorhanden?
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        SSH_HOST: ${{ vars.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        missing=""
        for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_USER DEPLOY_PATH; do [ -n "${!v}" ] || missing="$missing $v"; done
        if [ -n "$missing" ]; then
          echo "::error::Im Environment production fehlt:$missing (Einrichtung oben in dieser Datei)."
          exit 1
        fi
        # Alle Websites liegen im selben Hosting nebeneinander - rsync --delete darf nur in den
        # Ordner dieser Website (Schutz vor einem kopierten DEPLOY_PATH eines anderen Projekts).
        case "${DEPLOY_PATH%/}" in */0701_Sspg.ch) ;; *) echo "::error::DEPLOY_PATH zeigt nicht auf den Ordner 0701_Sspg.ch."; exit 1 ;; esac

    - name: Get latest code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20

    # Minifizieren usw. (gleiches Skript wie in tests.yml)
    - name: Build
      run: bash .github/deploy/build.sh

    # Deploy per SSH/rsync: eine Verbindung, nur Geändertes, komprimiert. Sicherheitsnetz: ohne
    # Variable DEPLOY_RSYNC_LIVE=true im Environment nur ein Probelauf (--dry-run), der zeigt, was
    # übertragen und gelöscht würde.
    - name: SSH-Zugang einrichten
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        # '~/'* gequotet: ungequotet würde bash die Tilde im Muster zum Home des Runners expandieren.
        case "$DEPLOY_PATH" in /*|'~/'*) ;; *) echo "::error::DEPLOY_PATH muss absolut sein oder mit ~/ beginnen"; exit 1 ;; esac
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Sync files (PROD, rsync)
      env:
        SSH_HOST: ${{ vars.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PORT: ${{ vars.SSH_PORT }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        LIVE: ${{ vars.DEPLOY_RSYNC_LIVE }}
      run: |
        # Ohne pipefail zählte nur der Exit-Code von tee - ein fehlgeschlagener rsync bliebe grün.
        set -o pipefail
        DRY="--dry-run"
        if [ "$LIVE" = "true" ]; then DRY=""; else echo "::warning::PROBELAUF (DEPLOY_RSYNC_LIVE ist nicht true) - es wird nichts übertragen oder gelöscht."; fi
        SSH="ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
        # -r rekursiv, -l Links, -z komprimiert, -c Vergleich nach Inhalt (der Checkout gibt allen
        # Dateien ein neues Datum; ohne -t behalten unveränderte Dateien ihr Datum), -i Änderungen
        # auflisten; Rechte fest (Shared Hosting); geänderte Dateien kommen erst am Ende an ihren Platz
        # (--delay-updates), gelöscht wird zuletzt. Das Log liegt ausserhalb des Checkouts, sonst
        # würde rsync es gleich mit hochladen.
        rsync -rlzci --chmod=D755,F644 --delete --delete-delay --delay-updates $DRY \
          --filter='merge .github/deploy/rsync-filter' \
          -e "$SSH" ./ "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/" | tee "$RUNNER_TEMP/rsync.log"
        echo "Gelöscht bzw. zu löschen: $(grep -c '^\*deleting' "$RUNNER_TEMP/rsync.log" || true) · übertragen bzw. zu übertragen: $(grep -cE '^[<>c]f' "$RUNNER_TEMP/rsync.log" || true)"
        if [ -n "$DRY" ]; then
          echo "Probelauf beendet. Liste oben prüfen (Zeilen mit *deleting), dann DEPLOY_RSYNC_LIVE=true setzen."
          exit 1
        fi

    # alle Seiten der Sitemap, verlinkte Dateien und 404 auf PROD (gleiches Skript wie in tests.yml)
    - name: Smoke-Test
      timeout-minutes: 5
      run: bash .github/deploy/smoke.sh https://sspg.ch

  lighthouse-prod:
    name: Lighthouse (PROD)
    needs: web-deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20

    - name: Lighthouse
      env:
        LH_URL: https://sspg.ch
        LH_PROFILE: prod
      run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

    - name: Lighthouse-Zusammenfassung
      if: always()
      run: node scripts/lighthouse-summary.cjs >> "$GITHUB_STEP_SUMMARY"

    - name: Lighthouse-Berichte
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lighthouse
        path: .lighthouseci/reports/
        retention-days: 14
