name: Dependabot auto-merge

# DEPENDABOT (2026-11): merged Pull Requests von Dependabot mit reinen Minor-/Patch-Updates, sobald die Tests des
# Pull Requests grün sind. Majors und Minors unter 1.0 bleiben für eine manuelle Prüfung offen.
# - Läuft vom Default-Branch aus nach dem Test-Workflow des Pull Requests (workflow_run), nie mit dessen Code.
# - Merged nur, wenn Pull Request und Head-Commit von Dependabot stammen (Commit von GitHub verifiziert), der
#   getestete Commit noch der Head ist und jedes Update semver-patch/-minor ist (Metadaten in der Commit-Message).
# - Ein Merge mit dem GITHUB_TOKEN löst keine Push-Workflows aus, darum wird der Deploy ausdrücklich gestartet.
# Cooldown (7 Tage) und Gruppierung der Minor-/Patch-Updates: .github/dependabot.yml.
# ENFORCE (2026-11): Mit ENFORCE_DEPLOYMENT=true fallen die Tests weg und der Lauf ist trotzdem grün - dann kein Auto-Merge.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    name: Merge minor/patch updates
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      vars.ENFORCE_DEPLOYMENT != 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      BASE_BRANCH: main
      DEPLOY_WORKFLOW: "prod-deploy.yml"
      MANUAL_PATHS: ""
    steps:
      - name: Check the update and merge
        id: merge
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open \
            --json number,author,headRefOid,isDraft,mergeable \
            --jq '[.[] | select(.author.login == "app/dependabot")] | first // empty')
          if [ -z "$pr" ]; then
            echo "::notice::No open Dependabot pull request for $HEAD_BRANCH into $BASE_BRANCH."
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "::notice::#$number has commits newer than the tested one, the next test run decides."
            exit 0
          fi
          if [ "$(jq -r .isDraft <<<"$pr")" = "true" ] || [ "$(jq -r .mergeable <<<"$pr")" = "CONFLICTING" ]; then
            echo "::notice::#$number is a draft or has conflicts (Dependabot rebases it)."
            exit 0
          fi
          commit=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA")
          if [ "$(jq -r .author.login <<<"$commit")" != "dependabot[bot]" ] \
            || [ "$(jq -r .commit.verification.verified <<<"$commit")" != "true" ]; then
            echo "::notice::#$number: the head commit is no verified Dependabot commit, not merged automatically."
            exit 0
          fi
          if [ -n "$MANUAL_PATHS" ]; then
            files=$(gh pr view "$number" --json files --jq '.files[].path')
            for path in $MANUAL_PATHS; do
              if grep -qxF "$path" <<<"$files"; then
                echo "::notice::#$number changes $path, which always needs a manual review."
                exit 0
              fi
            done
          fi
          # metadata block of the Dependabot commit message: one entry per updated dependency
          entries=$(jq -r .commit.message <<<"$commit" | awk '
            /^updated-dependencies:/ { meta = 1; next }
            /^\.\.\.$/ { meta = 0 }
            !meta { next }
            /^- dependency-name:/ { if (name != "") print name "|" version "|" type; name = $3; version = ""; type = "" }
            /^  dependency-version:/ { version = $2 }
            /^  update-type:/ { type = $2 }
            END { if (name != "") print name "|" version "|" type }')
          if [ -z "$entries" ]; then
            echo "::notice::#$number: no update metadata in the commit message, not merged automatically."
            exit 0
          fi
          manual=""
          while IFS='|' read -r name version type; do
            case "$type" in
              version-update:semver-patch) ;;
              version-update:semver-minor)
                # below 1.0 a minor update may break the API
                case "$version" in "" | 0.* | v0.*) manual="$manual $name ($version, minor below 1.0)" ;; esac ;;
              *) manual="$manual $name (${type:-unknown update type})" ;;
            esac
          done <<<"$entries"
          if [ -n "$manual" ]; then
            echo "::notice::#$number needs a manual review:$manual"
            exit 0
          fi
          echo "#$number: $(tr '\n' ' ' <<<"$entries")"
          gh pr merge "$number" --merge --match-head-commit "$HEAD_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Start the deployment
        if: steps.merge.outputs.merged == 'true' && env.DEPLOY_WORKFLOW != ''
        run: gh workflow run "$DEPLOY_WORKFLOW" --ref "$BASE_BRANCH"
